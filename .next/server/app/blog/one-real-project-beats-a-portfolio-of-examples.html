ined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"b8Q_x_0OuCtolo0e0rb0-\"}\n"])</script><script>self.__next_f.push([1,"10:[]\na:\"$W10\"\n"])</script><script>self.__next_f.push([1,"11:I[49989,[\"/_next/static/chunks/0qin0_tic-ups.js\",\"/_next/static/chunks/41f41d37xw8fi.js\",\"/_next/static/chunks/169cvle-5gm9s.js\"],\"default\"]\n12:T40a,For a while, this page showed four case studies, and none of them were real. They were template examples — fictional businesses with invented problems, built to demonstrate what a case study page could look like before we had a client's permission to show their actual site. That's a normal way to launch a studio site. It's also, eventually, a liability: a portfolio that reads well but proves nothing.\n\nThe first real project on here now is ApaOil, a B2B lubricant importer whose entire buying process used to run through email and spreadsheets. We kept exactly one template example alongside it, on purpose, rather than deleting all four and leaving the page looking sparse — an honest \"here's one real thing and one placeholder\" beats a dishonest \"here are four polished fictions\" every time.\n\nThe plan from here is simple: as real projects ship, they replace the remaining example, one at a time, until there isn't a fictional business left on this page. If a case study on this site is up, it's because we actually built it.13:T45c,Por un tiempo, esta página mostraba cuatro casos de estudio, y ninguno era real. Eran ejemplos de plantilla — negocios ficticios con problemas inventados, construidos para mostrar cómo se vería una página de caso antes de tener el permiso de un cliente real para mostrar su sitio. Es una forma normal de lanzar el sitio de un estudio. También es, con el tiempo, un problema: un portafolio que se lee bien pero no demuestra nada.\n\nEl primer proyecto real aquí es ApaOil, un importador de lubricantes B2B cuyo proceso de compra completo solía pasar por correo y hojas de cálculo. Dejamos exactamente un ejemplo de plantilla junto a él, a propósito, en vez de borrar los cuatro y dejar la página vacía — un honesto \"aquí hay algo real y un marcador de posición\" le gana siempre a un deshonesto \"aquí hay cuatro ficciones bien pulidas\".\n\nEl plan desde aquí es simple: conforme se entreguen proyectos reales, van reemplazando el ejemplo que queda, uno a la vez, hasta que no quede ningún negocio ficticio en esta página. Si un caso de estudio está en este sitio, es porque de verdad lo construimos.7:[\"$\",\"$L11\",null,{\"post\":{\"slug\":\"one-real-project-beats-a-portfolio-of-examples\",\"title\":\"One real project is worth more than a portfolio of examples\",\"titleEs\":\"Un proyecto real vale más que un portafolio de ejemplos\",\"excerpt\":\"For a while, every project on this site was a template mockup. Here's why we'd rather show one honest case study than five polished fictions.\",\"excerptEs\":\"Por un tiempo, cada proyecto en este sitio era una maqueta de plantilla. Por qué preferimos mostrar un caso honesto en vez de cinco ficciones bien pulidas.\",\"body\":\"$12\",\"bodyEs\":\"$13\",\"date\":\"2026-07-27\",\"tag\":\"Work\",\"tagEs\":\"Trabajo\",\"isExample\":false}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"IconMark\"]\n9:null\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"title\",\"0\",{\"children\":\"One real project is worth more than a portfolio of examples — Fen Web Studio\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"For a while, every project on this site was a template mockup. Here's why we'd rather show one honest case study than five polished fictions.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"
