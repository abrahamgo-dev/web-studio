b\":\"Z__iFFtYtVeBmwY_4EE8i\"}\n"])</script><script>self.__next_f.push([1,"10:[]\na:\"$W10\"\n"])</script><script>self.__next_f.push([1,"11:I[49989,[\"/_next/static/chunks/0qin0_tic-ups.js\",\"/_next/static/chunks/41f41d37xw8fi.js\",\"/_next/static/chunks/1ds0zvunirhmp.js\"],\"default\"]\n12:T4b2,La mayoría de las páginas de proceso de agencias muestran una cuenta regresiva semana por semana: Descubrimiento en la semana uno, Diseño para la semana tres, Lanzamiento en la semana seis. Se lee bien, y casi siempre es ficción. El ritmo real de un proyecto depende mucho más de qué tan rápido un cliente puede mandar sus archivos de logo, aprobar una ronda de diseño o escribir el texto de su propia página de Nosotros, que de algo que nosotros controlemos.\n\nAntes publicábamos una versión de esa cuenta regresiva. Notamos que causaba el mismo problema siempre: el cliente trataba la \"Semana 6\" como una promesa en vez de una estimación, y cada retraso de su lado — una aprobación lenta, una foto que faltaba, un cambio de opinión sobre el título del inicio — se volvía una conversación sobre por qué el sitio iba \"tarde\", aunque no hubiéramos perdido ni un día.\n\nPor eso la página de proceso ahora muestra cinco pasos y lo que realmente pasa en cada uno, sin fechas pegadas. El calendario real se define en la primera llamada, una vez que ambos sabemos qué tan rápido puede moverse el otro lado — que es la única versión de un cronograma que alguna vez ha sido cierta."])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L11\",null,{\"post\":{\"slug\":\"why-we-dropped-the-project-timeline\",\"title\":\"Why our process page doesn't promise a fixed timeline\",\"titleEs\":\"Por qué nuestra página de proceso no promete un tiempo fijo\",\"excerpt\":\"Week 1, Weeks 2-3, Week 6 — deadlines that look precise on a page and rarely survive contact with a real client. Here's what we show instead.\",\"excerptEs\":\"Semana 1, Semanas 2-3, Semana 6 — plazos que se ven precisos en una página y rara vez sobreviven al contacto con un cliente real. Esto mostramos en su lugar.\",\"body\":\"Most agency process pages show a week-by-week countdown: Discovery in week one, Design by week three, Launch by week six. It reads well, and it's mostly fiction. The actual pace of a project depends far more on how fast a client can send logo files, approve a design round, or write the copy for their own About page than on anything we control.\\n\\nWe used to publish a version of that countdown. Then we noticed it caused the same problem every time: a client would treat \\\"Week 6\\\" as a promise instead of an estimate, and every delay on their end — a slow approval, a missing photo, a change of mind about the homepage headline — turned into a conversation about why the site was \\\"late,\\\" even when we hadn't lost a day.\\n\\nSo the process page now shows five steps and what actually happens in each one, with no dates attached. The real timeline gets set in the first call, once we both know how fast the other side can move — which is the only version of a schedule that's ever been true.\",\"bodyEs\":\"$12\",\"date\":\"2026-07-20\",\"tag\":\"Process\",\"tagEs\":\"Proceso\",\"isExample\":false}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:I[27201,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"IconMark\"]\n9:null\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"title\",\"0\",{\"children\":\"Why our process page doesn't promise a fixed timeline — Fen Web Studio\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Week 1, Weeks 2-3, Week 6 — deadlines that look precise on a page and rarely survive contact with a real client. Here's what we show instead.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, fo
