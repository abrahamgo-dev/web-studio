ks/2ggehoonr6s8q.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L11\",null,{\"post\":{\"slug\":\"what-a-care-plan-actually-covers\",\"title\":\"What actually goes into a monthly care plan\",\"titleEs\":\"Qué incluye realmente un plan de cuidado mensual\",\"excerpt\":\"\\\"Maintenance\\\" is a vague word. Here's the specific, boring list of things that quietly break on a small business site without one.\",\"excerptEs\":\"\\\"Mantenimiento\\\" es una palabra vaga. Aquí está la lista concreta y aburrida de lo que se rompe silenciosamente en un sitio sin un plan de cuidado.\",\"body\":\"Nobody budgets for a care plan because \\\"maintenance\\\" sounds like an insurance upsell. Then six months after launch, the hours changed, the phone number is wrong, a plugin nobody remembers installing broke the contact form, and the person who built the site isn't answering emails anymore.\\n\\nA care plan is really just a standing answer to a boring, specific list: content edits when your hours or menu change, dependency and security updates so the site doesn't quietly rot, form and link checks so a broken contact form doesn't cost you a lead for three weeks before anyone notices, and small layout fixes as your business adds a service or drops one.\\n\\nNone of that is glamorous. All of it is the difference between a site that still looks like it was built yesterday and one that quietly tells visitors nobody's been paying attention since it launched.\",\"bodyEs\":\"Nadie presupuesta un plan de cuidado porque \\\"mantenimiento\\\" suena a venta de seguro. Después, seis meses tras el lanzamiento, cambiaron los horarios, el teléfono está mal, un plugin que nadie recuerda instalar rompió el formulario de contacto, y quien construyó el sitio ya no contesta correos.\\n\\nUn plan de cuidado es, en realidad, una respuesta permanente a una lista concreta y aburrida: ediciones de contenido cuando cambian tus horarios o menú, actualizaciones de seguridad para que el sitio no se deteriore en silencio, revisión de formularios y enlaces para que un formulario roto no te cueste semanas de clientes sin que nadie lo note, y ajustes pequeños de diseño a medida que tu negocio suma o quita un servicio.\\n\\nNada de eso es glamoroso. Pero es la diferencia entre un sitio que sigue viéndose recién construido y uno que le dice en silencio a los visitantes que nadie le ha prestado atención desde que se lanzó.\",\"date\":\"2026-07-10\",\"tag\":\"Care plan\",\"tagEs\":\"Plan de cuidado\",\"isExample\":true}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:I[27201,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"IconMark\"]\n9:null\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"title\",\"0\",{\"children\":\"What actually goes into a monthly care plan — Fen Web Studio\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"\\\"Maintenance\\\" is a vague word. Here's the specific, boring list of things that quietly break on a small business site without one.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://www.fenwebstudio.com/blog/what-a-care-plan-actually-covers\"}],[\"$\",\"meta\",\"4\",{\"name\":\"google-site-verification\",\"content\":\"htOn55zWJcchNLEr-_PPlBy7cwraqVKwWN4jpfylCxQ\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"What actually goes into a monthly care plan — Fen Web Studio\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"\\\"Maintenance\\\" is a vague word. Here's the specific, boring list of things that quietly break on a small business site without one.\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta
