u-first restaurant websites that are easy to update and easy to book from — built once, cared for every month. See how we replaced a stale PDF menu with a real site.\",\"metaDescriptionEs\":\"Sitios web para restaurantes centrados en el menú, fáciles de actualizar y reservar — construidos una vez, cuidados cada mes. Mira cómo reemplazamos un menú en PDF por un sitio real.\",\"eyebrow\":\"For restaurants and cafés\",\"eyebrowEs\":\"Para restaurantes y cafés\",\"title\":\"A website that keeps up with your menu, not the other way around.\",\"titleEs\":\"Un sitio web que se actualiza con tu menú, no al revés.\",\"intro\":\"Most restaurant sites are a splash page linking to a PDF nobody bothers to open on a phone. We build the menu as an actual page — readable, current, and easy for you to update the same week a dish changes — with reservations one tap away instead of buried in a footer.\",\"introEs\":\"La mayoría de los sitios de restaurantes son una página de bienvenida que enlaza a un PDF que nadie abre bien desde el teléfono. Construimos el menú como una página real — legible, actualizada, y fácil de modificar la misma semana que cambia un platillo — con reservas a un toque de distancia en vez de escondidas en el pie de página.\",\"painPoints\":[{\"title\":\"The menu is a PDF nobody can read on a phone\",\"titleEs\":\"El menú es un PDF que nadie puede leer bien en el celular\",\"body\":\"Tiny text, sideways scrolling, and a file that's months out of date because updating it means calling whoever built the site.\",\"bodyEs\":\"Texto diminuto, scroll horizontal, y un archivo desactualizado por meses porque cambiarlo significa llamar a quien hizo el sitio.\"},{\"title\":\"Reservations happen by phone during service\",\"titleEs\":\"Las reservas se hacen por teléfono durante el servicio\",\"body\":\"Every call during a dinner rush is a distraction your staff doesn't need, and a guest who could've booked in ten seconds online.\",\"bodyEs\":\"Cada llamada durante la hora pico es una distracción que tu equipo no necesita, y un cliente que pudo reservar en línea en diez segundos.\"},{\"title\":\"The photos don't match the room\",\"titleEs\":\"Las fotos no reflejan el lugar\",\"body\":\"A stock-photo hero image or a decade-old interior shot undersells a space that looks great in person.\",\"bodyEs\":\"Una imagen genérica de stock o una foto del interior de hace diez años no le hace justicia a un lugar que se ve muy bien en persona.\"}],\"approachPoints\":[{\"title\":\"Menu as a real page, not a download\",\"titleEs\":\"Menú como página real, no como descarga\",\"body\":\"You edit it like a document — no developer required — and it renders cleanly on every phone.\",\"bodyEs\":\"Lo editas como un documento — sin necesitar desarrollador — y se ve bien en cualquier celular.\"},{\"title\":\"Booking built into the design\",\"titleEs\":\"Reservas integradas al diseño\",\"body\":\"Reservations live inside your site's own look, not a mismatched third-party widget that breaks the mood.\",\"bodyEs\":\"Las reservas viven dentro del diseño de tu propio sitio, no en un widget externo que no combina y rompe el ambiente.\"},{\"title\":\"A monthly care plan\",\"titleEs\":\"Un plan de cuidado mensual\",\"body\":\"Seasonal menu swaps, new photography, small copy edits — handled without another agency invoice.\",\"bodyEs\":\"Cambios de menú por temporada, fotos nuevas, ajustes de texto — resueltos sin otra factura de agencia.\"}],\"caseStudyLabel\":\"See how we did this for Rosewood Table\",\"caseStudyLabelEs\":\"Mira cómo lo hicimos para Rosewood Table\"}}]],[\"$L8\",\"$L9\"],\"$La\"]}],{},null,false,null]},null,false,\"$@b\"]},null,false,null],\"$Lc\",false]],\"m\":\"$undefined\",\"G\":[\"$d\",[\"$Le\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"Z__iFFtYtVeBmwY_4EE8i\"}\n"])</script><script>self.__next_f.push([1,"f:I[97367,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chu
