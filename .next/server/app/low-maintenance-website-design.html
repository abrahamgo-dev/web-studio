ios Web de Bajo Mantenimiento — Fen Web Studio\",\"metaDescription\":\"A website you're not responsible for keeping alive — no CMS login, no plugin updates, no page-builder subscription. Small changes handled for you every month instead.\",\"metaDescriptionEs\":\"Un sitio web del que no eres responsable de mantener vivo — sin entrar a ningún CMS, sin actualizar plugins, sin suscripción a un constructor visual. Los cambios pequeños se resuelven por ti cada mes.\",\"eyebrow\":\"For owners who don't want another login to manage\",\"eyebrowEs\":\"Para dueños que no quieren otro acceso más que administrar\",\"title\":\"A website that's someone else's job to maintain — because it's ours.\",\"titleEs\":\"Un sitio web que es trabajo de alguien más mantener — porque es nuestro.\",\"intro\":\"Not every business owner wants to learn a CMS, and they shouldn't have to. We build the site, then handle the small stuff every month — text changes, new photos, a fixed typo — so it stays current without becoming one more account you have to log into.\",\"introEs\":\"No todo dueño de negocio quiere aprender a usar un CMS, y no debería tener que hacerlo. Construimos el sitio, y luego nos encargamos de lo pequeño cada mes — cambios de texto, fotos nuevas, una errata corregida — para que se mantenga al día sin volverse una cuenta más en la que tienes que entrar.\",\"painPoints\":[{\"title\":\"A CMS login nobody has time to learn\",\"titleEs\":\"Un acceso a CMS que nadie tiene tiempo de aprender\",\"body\":\"Even a 'simple' page builder still means learning an interface, and re-learning it every time it changes.\",\"bodyEs\":\"Incluso un constructor 'simple' significa aprender una interfaz, y volver a aprenderla cada vez que cambia.\"},{\"title\":\"Plugins and updates that quietly break things\",\"titleEs\":\"Plugins y actualizaciones que rompen cosas en silencio\",\"body\":\"A missed update can take a site down, or open a security hole, without anyone noticing for weeks.\",\"bodyEs\":\"Una actualización que se pasa puede tumbar el sitio, o dejar un hueco de seguridad, sin que nadie se dé cuenta por semanas.\"},{\"title\":\"Small changes end up waiting for months\",\"titleEs\":\"Los cambios pequeños terminan esperando meses\",\"body\":\"A one-line text edit shouldn't require finding a freelancer or remembering an admin password from two years ago.\",\"bodyEs\":\"Un cambio de una línea de texto no debería requerir buscar a un freelancer o recordar una contraseña de hace dos años.\"}],\"approachPoints\":[{\"title\":\"Built on Next.js, not a page builder\",\"titleEs\":\"Construido en Next.js, no en un constructor visual\",\"body\":\"No plugin ecosystem to maintain, no admin panel to secure — the site is just fast, static, and simple underneath.\",\"bodyEs\":\"Sin ecosistema de plugins que mantener, sin panel de administración que asegurar — el sitio es rápido, estático y simple por dentro.\"},{\"title\":\"Small requests handled monthly, not invoiced one by one\",\"titleEs\":\"Solicitudes pequeñas resueltas cada mes, sin cotizar una por una\",\"body\":\"Text edits, new photos, small fixes — sent over, handled, done, as part of the standing care plan.\",\"bodyEs\":\"Cambios de texto, fotos nuevas, ajustes pequeños — se envían, se resuelven, listo, como parte del plan de cuidado.\"},{\"title\":\"One point of contact, not a support ticket queue\",\"titleEs\":\"Un solo punto de contacto, no una fila de tickets de soporte\",\"body\":\"A direct line to the person who actually built the site, instead of a generic help desk.\",\"bodyEs\":\"Una línea directa con quien realmente construyó el sitio, en vez de una mesa de ayuda genérica.\"}]}}]],[\"$L8\",\"$L9\"],\"$La\"]}],{},null,false,null]},null,false,\"$@b\"]},null,false,null],\"$Lc\",false]],\"m\":\"$undefined\",\"G\":[\"$d\",[\"$Le\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"b8Q_x_0OuCtolo0e0rb0-\"}\n"])</script><script>self.__next_f.pus
