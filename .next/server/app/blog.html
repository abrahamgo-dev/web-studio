-><script src="/_next/static/chunks/2iho8jepmwwua.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[39756,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"default\"]\n3:I[37457,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"default\"]\n4:I[79520,[\"/_next/static/chunks/0qin0_tic-ups.js\"],\"\"]\n5:\"$Sreact.suspense\"\n6:I[24462,[\"/_next/static/chunks/0qin0_tic-ups.js\"],\"default\"]\n7:I[45300,[\"/_next/static/chunks/0qin0_tic-ups.js\",\"/_next/static/chunks/0hs_6j34ey842.js\",\"/_next/static/chunks/1ds0zvunirhmp.js\"],\"default\"]\n10:I[68027,[\"/_next/static/chunks/0qin0_tic-ups.js\"],\"default\",1]\n:HL[\"/_next/static/chunks/18z2tfey09fo7.css\",\"style\"]\n:HC[\"/\",\"\"]\n8:T40a,For a while, this page showed four case studies, and none of them were real. They were template examples — fictional businesses with invented problems, built to demonstrate what a case study page could look like before we had a client's permission to show their actual site. That's a normal way to launch a studio site. It's also, eventually, a liability: a portfolio that reads well but proves nothing.\n\nThe first real project on here now is ApaOil, a B2B lubricant importer whose entire buying process used to run through email and spreadsheets. We kept exactly one template example alongside it, on purpose, rather than deleting all four and leaving the page looking sparse — an honest \"here's one real thing and one placeholder\" beats a dishonest \"here are four polished fictions\" every time.\n\nThe plan from here is simple: as real projects ship, they replace the remaining example, one at a time, until there isn't a fictional business left on this page. If a case study on this site is up, it's because we actually built it.9:T45c,Por un tiempo, esta página mostraba cuatro casos de estudio, y ninguno era real. Eran ejemplos de plantilla — negocios ficticios con problemas inventados, construidos para mostrar cómo se vería una página de caso antes de tener el permiso de un cliente real para mostrar su sitio. Es una forma normal de lanzar el sitio de un estudio. También es, con el tiempo, un problema: un portafolio que se lee bien pero no demuestra nada.\n\nEl primer proyecto real aquí es ApaOil, un importador de lubricantes B2B cuyo proceso de compra completo solía pasar por correo y hojas de cálculo. Dejamos exactamente un ejemplo de plantilla junto a él, a propósito, en vez de borrar los cuatro y dejar la página vacía — un honesto \"aquí hay algo real y un marcador de posición\" le gana siempre a un deshonesto \"aquí hay cuatro ficciones bien pulidas\".\n\nEl plan desde aquí es simple: conforme se entreguen proyectos reales, van reemplazando el ejemplo que queda, uno a la vez, hasta que no quede ningún negocio ficticio en esta página. Si un caso de estudio está en este sitio, es porque de verdad lo construimos.a:T4b2,La mayoría de las páginas de proceso de agencias muestran una cuenta regresiva semana por semana: Descubrimiento en la semana uno, Diseño para la semana tres, Lanzamiento en la semana seis. Se lee bien, y casi siempre es ficción. El ritmo real de un proyecto depende mucho más de qué tan rápido un cliente puede mandar sus archivos de logo, aprobar una ronda de diseño o escribir el texto de su propia página de Nosotros, que de algo que nosotros controlemos.\n\nAntes publicábamos una versión de esa cuenta regresiva. Notamos que causaba el mismo problema siempre: el cliente trataba la \"Semana 6\" como una promesa en vez de una estimación, y cada retraso de su lado — una aprobación lenta, una foto que faltaba, un cambio de opinión sobre el título del inicio — se volvía una conversación sobre por qué el sitio iba \"tarde\", aunque no hubiéramos perdido ni un día.\n\nPor eso la página de proceso ahora muestra cinco pasos y lo que realmente pasa en cada uno, sin fechas pegadas. El calendario real se define en la primera llamada, una vez que ambos sabemos qué tan rápido puede moverse el otro lado — que es la única versión de un cronograma que alguna vez ha sido cierta."])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"c\":[\"\",\"blog\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"blog\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",16],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/18z2tfey09fo7.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/0qin0_tic-ups.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"data-scroll-behavior\":\"smooth\",\"children\":[\"$\",\"body\",null,{\"className\":\"antialiased\",\"children\":[[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[[\"$\",\"title\",null,{\"children\":\"404: This page could not be found.\"}],[\"$\",\"div\",null,{\"style\":{\"fontFamily\":\"system-ui,\\\"Segoe UI\\\",Roboto,Helvetica,Arial,sans-serif,\\\"Apple Color Emoji\\\",\\\"Segoe UI Emoji\\\"\",\"height\":\"100vh\",\"textAlign\":\"center\",\"display\":\"flex\",\"flexDirection\":\"column\",\"alignItems\":\"center\",\"justifyContent\":\"center\"},\"children\":[\"$\",\"div\",null,{\"children\":[[\"$\",\"style\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"body{color:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid rgba(255,255,255,.3)}}\"}}],[\"$\",\"h1\",null,{\"className\":\"next-error-h1\",\"style\":{\"display\":\"inline-block\",\"margin\":\"0 20px 0 0\",\"padding\":\"0 23px 0 0\",\"fontSize\":24,\"fontWeight\":500,\"verticalAlign\":\"top\",\"lineHeight\":\"49px\"},\"children\":404}],[\"$\",\"div\",null,{\"style\":{\"display\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]],[]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"ProfessionalService\\\",\\\"name\\\":\\\"Fen Web Studio\\\",\\\"url\\\":\\\"https://www.fenwebstudio.com\\\",\\\"description\\\":\\\"Fen Web Studio designs elegant, no-clutter websites for small and medium businesses, then keeps them polished with a monthly care plan.\\\",\\\"image\\\":\\\"https://www.fenwebstudio.com/icon.svg\\\",\\\"priceRange\\\":\\\"$$\\\",\\\"sameAs\\\":[\\\"https://www.instagram.com/fenwebstudio/\\\",\\\"https://www.facebook.com/Fenwebstudio/\\\",\\\"https://www.linkedin.com/company/fen-web-studio/\\\"]}\"}}],[[\"$\",\"$L4\",null,{\"src\":\"https://www.googletagmanager.com/gtag/js?id=G-SGDRGVBX1T\",\"strategy\":\"afterInteractive\"}],[\"$\",\"$L4\",null,{\"id\":\"ga4-init\",\"strategy\":\"afterInteractive\",\"children\":\"\\n          window.dataLayer = window.dataLayer || [];\\n          function gtag(){dataLayer.push(arguments);}\\n          gtag('js', new Date());\\n          gtag('config', 'G-SGDRGVBX1T', { send_page_view: false });\\n        \"}],[\"$\",\"$5\",null,{\"fallback\":null,\"children\":[\"$\",\"$L6\",null,{}]}]]]}]}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L7\",null,{\"posts\":[{\"slug\":\"one-real-project-beats-a-portfolio-of-examples\",\"title\":\"One real project is worth more than a portfolio of examples\",\"titleEs\":\"Un proyecto real vale más que un portafolio de ejemplos\",\"excerpt\":\"For a while, every project on this site was a template mockup. Here's why we'd rather show one honest case study than five polished fictions.\",\"excerptEs\":\"Por un tiempo, cada proyecto en este sitio era una maqueta de plantilla. Por qué preferimos mostrar un caso honesto en vez de cinco ficciones bien pulidas.\",\"body\":\"$8\",\"bodyEs\":\"$9\",\"date\":\"2026-07-27\",\"tag\":\"Work\",\"tagEs\":\"Trabajo\",\"isExample\":false},{\"slug\":\"why-we-dropped-the-project-timeline\",\"title\":\"Why our process page doesn't promise a fixed timeline\",\"titleEs\":\"Por qué nuestra página de proceso no promete un tiempo fijo\",\"excerpt\":\"Week 1, Weeks 2-3, Week 6 — deadlines that look precise on a page and rarely survive contact with a real client. Here's what we show instead.\",\"excerptEs\":\"Semana 1, Semanas 2-3, Semana 6 — plazos que se ven precisos en una página y rara vez sobreviven al contacto con un cliente real. Esto mostramos en su lugar.\",\"body\":\"Most agency process pages show a week-by-week countdown: Discovery in week one, Design by week three, Launch by week six. It reads well, and it's mostly fiction. The actual pace of a project depends far more on how fast a client can send logo files, approve a design round, or write the copy for their own About page than on anything we control.\\n\\nWe used to publish a version of that countdown. Then we noticed it caused the same problem every time: a client would treat \\\"Week 6\\\" as a promise instead of an estimate, and every delay on their end — a slow approval, a missing photo, a change of mind about the homepage headline — turned into a conversation about why the site was \\\"late,\\\" even when we hadn't lost a day.\\n\\nSo the process page now shows five steps and what actually happens in each one, with no dates attached. The real timeline gets set in the first call, once we both know how fast the other side can move — which is the only version of a schedule that's ever been true.\",\"bodyEs\":\"$a\",\"date\":\"2026-07-20\",\"tag\":\"Process\",\"tagEs\":\"Proceso\",\"isExample\":false},{\"slug\":\"what-a-care-plan-actually-covers\",\"title\":\"What actually goes into a monthly care plan\",\"titleEs\":\"Qué incluye realmente un plan de cuidado mensual\",\"excerpt\":\"\\\"Maintenance\\\" is a vague word. Here's the specific, boring list of things that quietly break on a small business site without one.\",\"excerptEs\":\"\\\"Mantenimiento\\\" es una palabra vaga. Aquí está la lista concreta y aburrida de lo que se rompe silenciosamente en un sitio sin un plan de cuidado.\",\"body\":\"Nobody budgets for a care plan because \\\"maintenance\\\" sounds like an insurance upsell. Then six months after launch, the hours changed, the phone number is wrong, a plugin nobody remembers installing broke the contact form, and the person who built the site isn't answering emails anymore.\\n\\nA care plan is really just a standing answer to a boring, specific list: content edits when your hours or menu change, dependency and security updates so the site doesn't quietly rot, form and link checks so a broken contact form doesn't cost you a lead for three weeks before anyone notices, and small layout fixes as your business adds a service or drops one.\\n\\nNone of that is glamorous. All of it is the difference between a site that still looks like it was built yesterday and one that quietly tells visitors nobody's been paying attention since it launched.\",\"bodyEs\":\"Nadie presupuesta un plan de cuidado porque \\\"mantenimiento\\\" suena a venta de seguro. Después, seis meses tras el lanzamiento, cambiaron los horarios, el teléfono está mal, un plugin que nadie recuerda instalar rompió el formulario de contacto, y quien construyó el sitio ya no contesta correos.\\n\\nUn plan de cuidado es, en realidad, una respuesta permanente a una lista concreta y aburrida: ediciones de contenido cuando cambian tus horarios o menú, actualizaciones de seguridad para que el sitio no se deteriore en silencio, revisión de formularios y enlaces para que un formulario roto no te cueste semanas de clientes sin que nadie lo note, y ajustes pequeños de diseño a medida que tu negocio suma o quita un servicio.\\n\\nNada de eso es glamoroso. Pero es la diferencia entre un sitio que sigue viéndose recién construido y uno que le dice en silencio a los visitantes que nadie le ha prestado atención desde que se lanzó.\",\"date\":\"2026-07-10\",\"tag\":\"Care plan\",\"tagEs\":\"Plan de cuidado\",\"isExample\":true},{\"slug\":\"fewer-pages-more-credible\",\"title\":\"Why fewer pages make your site more credible\",\"titleEs\":\"Por qué menos páginas hacen tu sitio más creíble\",\"excerpt\":\"Most small business sites lose visitors to a menu bar, not a bad product. Here's why cutting pages usually beats adding them.\",\"excerptEs\":\"La mayoría de los sitios de negocios pequeños pierden visitantes por un menú, no por un mal producto. Por qué quitar páginas suele ganarle a agregar más.\",\"body\":\"Every extra page in your navigation is a decision you're asking a stranger to make before they trust you. \\\"Home,\\\" \\\"About,\\\" \\\"Services,\\\" \\\"Blog,\\\" \\\"FAQ,\\\" \\\"Team\\\" — six clicks that all lead to the same conclusion a single well-written page could reach in one scroll.\\n\\nWe see this constantly with new clients: a site with twelve pages and forty visits a month, most of them bouncing from the homepage before they ever see the other eleven. The fix is rarely \\\"write more content.\\\" It's usually \\\"delete the pages that exist because a template shipped with them, not because anyone needed them.\\\"\\n\\nA good rule of thumb: if a page hasn't been opened in your analytics in the last quarter, it's not serving your visitors — it's serving the idea of a complete website. Cut it, fold the one useful sentence into a page people actually read, and watch your bounce rate move more than any redesign will.\",\"bodyEs\":\"Cada página adicional en tu menú es una decisión que le pides a un desconocido tomar antes de confiar en ti. \\\"Inicio\\\", \\\"Nosotros\\\", \\\"Servicios\\\", \\\"Blog\\\", \\\"Preguntas frecuentes\\\", \\\"Equipo\\\" — seis clics que terminan en la misma conclusión a la que una sola página bien escrita llegaría en un scroll.\\n\\nLo vemos todo el tiempo con clientes nuevos: un sitio con doce páginas y cuarenta visitas al mes, la mayoría abandonando desde el inicio antes de ver las otras once. La solución casi nunca es \\\"escribir más contenido\\\". Casi siempre es \\\"eliminar las páginas que existen porque venían con la plantilla, no porque alguien las necesitara\\\".\\n\\nUna buena regla: si una página no se ha abierto en tus analíticas en el último trimestre, no está sirviendo a tus visitantes — está sirviendo la idea de un sitio completo. Elimínala, integra la única frase útil en una página que sí se lee, y verás que tu tasa de rebote se mueve más que con cualquier rediseño.\",\"date\":\"2026-06-02\",\"tag\":\"Design\",\"tagEs\":\"Diseño\",\"isExample\":true}]}],[\"$Lb\",\"$Lc\"],\"$Ld\"]}],{},null,false,null]},null,false,\"$@e\"]},null,false,null],\"$Lf\",false]],\"m\":\"$undefined\",\"G\":[\"$10\",[\"$L11\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"Z__iFFtYtVeBmwY_4EE8i\"}\n"])</script><script>self.__next_f.push([1,"12:I[97367,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"OutletBoundary\"]\n15:I[97367,[\"/_next/static/chunks/05-c3ty_6dwfk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"Vi
