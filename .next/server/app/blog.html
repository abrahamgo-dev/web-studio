1\",\"c\",{\"children\":[[\"$\",\"$L7\",null,{\"posts\":[{\"slug\":\"what-a-care-plan-actually-covers\",\"title\":\"What actually goes into a monthly care plan\",\"titleEs\":\"Qué incluye realmente un plan de cuidado mensual\",\"excerpt\":\"\\\"Maintenance\\\" is a vague word. Here's the specific, boring list of things that quietly break on a small business site without one.\",\"excerptEs\":\"\\\"Mantenimiento\\\" es una palabra vaga. Aquí está la lista concreta y aburrida de lo que se rompe silenciosamente en un sitio sin un plan de cuidado.\",\"body\":\"Nobody budgets for a care plan because \\\"maintenance\\\" sounds like an insurance upsell. Then six months after launch, the hours changed, the phone number is wrong, a plugin nobody remembers installing broke the contact form, and the person who built the site isn't answering emails anymore.\\n\\nA care plan is really just a standing answer to a boring, specific list: content edits when your hours or menu change, dependency and security updates so the site doesn't quietly rot, form and link checks so a broken contact form doesn't cost you a lead for three weeks before anyone notices, and small layout fixes as your business adds a service or drops one.\\n\\nNone of that is glamorous. All of it is the difference between a site that still looks like it was built yesterday and one that quietly tells visitors nobody's been paying attention since it launched.\",\"bodyEs\":\"Nadie presupuesta un plan de cuidado porque \\\"mantenimiento\\\" suena a venta de seguro. Después, seis meses tras el lanzamiento, cambiaron los horarios, el teléfono está mal, un plugin que nadie recuerda instalar rompió el formulario de contacto, y quien construyó el sitio ya no contesta correos.\\n\\nUn plan de cuidado es, en realidad, una respuesta permanente a una lista concreta y aburrida: ediciones de contenido cuando cambian tus horarios o menú, actualizaciones de seguridad para que el sitio no se deteriore en silencio, revisión de formularios y enlaces para que un formulario roto no te cueste semanas de clientes sin que nadie lo note, y ajustes pequeños de diseño a medida que tu negocio suma o quita un servicio.\\n\\nNada de eso es glamoroso. Pero es la diferencia entre un sitio que sigue viéndose recién construido y uno que le dice en silencio a los visitantes que nadie le ha prestado atención desde que se lanzó.\",\"date\":\"2026-07-10\",\"tag\":\"Care plan\",\"tagEs\":\"Plan de cuidado\",\"isExample\":true},{\"slug\":\"fewer-pages-more-credible\",\"title\":\"Why fewer pages make your site more credible\",\"titleEs\":\"Por qué menos páginas hacen tu sitio más creíble\",\"excerpt\":\"Most small business sites lose visitors to a menu bar, not a bad product. Here's why cutting pages usually beats adding them.\",\"excerptEs\":\"La mayoría de los sitios de negocios pequeños pierden visitantes por un menú, no por un mal producto. Por qué quitar páginas suele ganarle a agregar más.\",\"body\":\"Every extra page in your navigation is a decision you're asking a stranger to make before they trust you. \\\"Home,\\\" \\\"About,\\\" \\\"Services,\\\" \\\"Blog,\\\" \\\"FAQ,\\\" \\\"Team\\\" — six clicks that all lead to the same conclusion a single well-written page could reach in one scroll.\\n\\nWe see this constantly with new clients: a site with twelve pages and forty visits a month, most of them bouncing from the homepage before they ever see the other eleven. The fix is rarely \\\"write more content.\\\" It's usually \\\"delete the pages that exist because a template shipped with them, not because anyone needed them.\\\"\\n\\nA good rule of thumb: if a page hasn't been opened in your analytics in the last quarter, it's not serving your visitors — it's serving the idea of a complete website. Cut it, fold the one useful sentence into a page people actually read, and watch your bounce rate move more than any redesign will.\",\"bodyEs\":\"Cada página adicional en tu menú es una decisión que le pides a un desconocido tomar antes de confiar en ti. \\\"Inicio\\\", \\\"Nosotros\\\", \\\"Servicios\\\", \\\"Blog\\\", \\\"Preguntas frecuentes\\\", \\\"Equipo\\\" — seis clics que terminan en la misma conclusión a la que una sola página bien escrita llegaría en un scroll.\\n\\nLo vemos todo el tiempo con clientes nuevos: un sitio con doce páginas y cuarenta visitas al mes, la mayoría abandonando desde el inicio antes de ver las otras once. La solución casi nunca es \\\"escribir más contenido\\\". Casi siempre es \\\"eliminar las páginas que existen porque venían con la plantilla, no porque alguien las necesitara\\\".\\n\\nUna buena regla: si una página no se ha abierto en tus analíticas en el último trimestre, no está sirviendo a tus visitantes — está sirviendo la idea de un sitio completo. Elimínala, integra la única frase útil en una página que sí se lee, y verás que tu tasa de rebote se mueve más que con cualquier rediseño.\",\"date\":\"2026-06-02\",\"tag\":\"Design\",\"tagEs\":\"Diseño\",\"isExample\":true}]}],[\"$L8\",\"$L9\"],\"$La\"]}],{},null,false,null]},null,false,\"$@b\"]},null,false,null],\"$Lc\",false]],\"m\":\"$undefined\",\"G\":[\"$d\",[\"$Le\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"Ifm9rxPe68rNT4k8cfSam\"}\n"])</script><script>self.__next_f.push([1,"f:I[97367,[\"/_next/static/chunks/3dlychj7uvedb.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"OutletBoundary\"]\n12:I[97367,[\"/_next/static/chunks/3dlychj7uvedb.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"ViewportBoundary\"]\n14:I[97367,[\"/_next/static/chunks/3dlychj7uvedb.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"MetadataBoundary\"]\n8:[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/3z6ttj29deykd.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n9:[\"$\",\"script\",\"script-1\",{\"src\":\"/_next/static/chunks/1eeq-2mrdzjkw.js\",\"async\":true,\"nonce\":\"$undefined\"}]\na:[\"$\",\"$Lf\",null,{\"children\":[\"$
