radas — para que los clientes nuevos dejen de llamar y reserven en línea.\",\"eyebrow\":\"For studios, spas, and practitioners\",\"eyebrowEs\":\"Para estudios, spas y profesionales\",\"title\":\"A site as calm as the space it represents.\",\"titleEs\":\"Un sitio tan tranquilo como el espacio que representa.\",\"intro\":\"A wellness brand lives or dies on trust and tone before a client ever walks in. We build sites that read as an extension of the studio itself — with booking woven into the design instead of bolted on as a separate, brand-mismatched tool.\",\"introEs\":\"Una marca de bienestar depende de la confianza y el tono antes de que un cliente cruce la puerta. Construimos sitios que se sienten como una extensión del estudio mismo — con reservas integradas al diseño en vez de una herramienta aparte que no combina con la marca.\",\"painPoints\":[{\"title\":\"Booking links out to a mismatched third-party tool\",\"titleEs\":\"Las reservas enlazan a una herramienta externa que no combina\",\"body\":\"The calm, considered feeling of the site breaks the moment someone clicks 'Book' and lands somewhere generic.\",\"bodyEs\":\"La sensación calmada y cuidada del sitio se rompe en el momento en que alguien hace clic en 'Reservar' y llega a algo genérico.\"},{\"title\":\"New clients still call to ask basic questions\",\"titleEs\":\"Los clientes nuevos siguen llamando para preguntas básicas\",\"body\":\"Pricing, what to expect in a first session, how to prepare — if it's not clearly on the site, it becomes a phone call.\",\"bodyEs\":\"Precios, qué esperar en la primera sesión, cómo prepararse — si no está claro en el sitio, se convierte en una llamada.\"},{\"title\":\"The design feels clinical instead of calming\",\"titleEs\":\"El diseño se siente clínico en vez de calmado\",\"body\":\"A generic template undersells a practice built around care, attention, and a specific feeling.\",\"bodyEs\":\"Un template genérico no le hace justicia a una práctica construida sobre cuidado, atención y una sensación específica.\"}],\"approachPoints\":[{\"title\":\"Booking in the site's own visual language\",\"titleEs\":\"Reservas en el propio lenguaje visual del sitio\",\"body\":\"No jarring redirect to a third-party scheduler — the flow looks and feels like the rest of the brand.\",\"bodyEs\":\"Sin redirección brusca a un sistema externo — el flujo se ve y se siente como el resto de la marca.\"},{\"title\":\"An editorial, unhurried homepage\",\"titleEs\":\"Una página de inicio editorial y sin prisa\",\"body\":\"Fewer, better sections that let the space and the practice speak for themselves.\",\"bodyEs\":\"Menos secciones, pero mejores, que dejan que el espacio y la práctica hablen por sí mismos.\"},{\"title\":\"A monthly care plan\",\"titleEs\":\"Un plan de cuidado mensual\",\"body\":\"New offerings, updated bios, seasonal promotions — kept current without you touching any code.\",\"bodyEs\":\"Nuevos servicios, biografías actualizadas, promociones de temporada — al día sin que toques ningún código.\"}],\"caseStudyLabel\":\"See how we did this for Halcyon Health\",\"caseStudyLabelEs\":\"Mira cómo lo hicimos para Halcyon Health\"}}]],[\"$L8\",\"$L9\"],\"$La\"]}],{},null,false,null]},null,false,\"$@b\"]},null,false,null],\"$Lc\",false]],\"m\":\"$undefined\",\"G\":[\"$d\",[\"$Le\"]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"9VITVN_oWg2Hz9ZK_YG6G\"}\n"])</script><script>self.__next_f.push([1,"f:I[97367,[\"/_next/static/chunks/3dlychj7uvedb.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"OutletBoundary\"]\n12:I[97367,[\"/_next/static/chunks/3dlychj7uvedb.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"ViewportBoundary\"]\n14:I[97367,[\"/_next/static/chunks/3dlychj7uvedb.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"MetadataBoundary\"]\n8:[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/312f2ei-d41hv.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n9:[\"$\",\"script
